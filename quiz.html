    <div class="quiz-container">
      <div id="quiz">
        <div class="start-page">
          <h1>Commencer votre quiz ici !</h1>
          <h3>Mais d'abord veuillez sélectionner votre mode de difficulté</h3>
          <div id="quiz-option">
            <button id="normal">Quiz normal (10 questions)</button>
            <button id="hard">
              Quiz difficile (Beaucoup plus de questions !)
            </button>
          </div>
        </div>
        <div class="quiz-content">
          <h2 id="question"></h2>
          <h3 id="score"></h3>
          <div class="choice-container"></div>
          <h4 id="question-number"></h4>
        </div>
      </div>
